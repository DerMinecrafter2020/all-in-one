name: Release All-in-One

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to publish (for example v0.2.7)
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      should_release: ${{ steps.resolve.outputs.should_release }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve version and decide whether to release
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import tomllib

          extension = "backend-extensions/com_calagopus_chat"
          with open(f"{extension}/Cargo.toml", "rb") as manifest_file:
              cargo_version = tomllib.load(manifest_file)["package"]["version"]
          with open(f"{extension}/frontend/package.json", encoding="utf-8") as package_file:
              frontend_version = json.load(package_file)["version"]

          if cargo_version != frontend_version:
              raise SystemExit(
                  f"Cargo.toml version {cargo_version} must match "
                  f"frontend/package.json version {frontend_version}"
              )

          event_name = os.environ["EVENT_NAME"]
          ref_type = os.environ.get("REF_TYPE", "")
          ref_name = os.environ["REF_NAME"]
          if event_name == "workflow_dispatch":
              release_tag = os.environ["INPUT_TAG"]
          elif ref_type == "tag":
              release_tag = ref_name
          else:
              release_tag = f"v{cargo_version}"

          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", release_tag)
          if match is None or ".".join(match.groups()) != cargo_version:
              raise SystemExit(
                  f"Release tag {release_tag!r} must match package version {cargo_version}"
              )

          should_release = True
          if event_name == "push" and ref_type == "branch":
              tag_lookup = subprocess.run(
                  ["git", "ls-remote", "--exit-code", "--tags", "origin", f"refs/tags/{release_tag}"],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if tag_lookup.returncode not in (0, 2):
                  raise SystemExit(f"Could not check remote tag {release_tag}: {tag_lookup.stderr}")
              tag_exists = tag_lookup.returncode == 0
              if tag_exists:
                  should_release = False
                  print(f"{release_tag} already exists; no duplicate release will be created.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_tag={release_tag}\n")
              output.write(f"should_release={str(should_release).lower()}\n")
          PY

  preflight:
    name: Build check against Panel ${{ matrix.panel_ref }}
    runs-on: ubuntu-24.04
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        panel_ref:
          - release-1.2.5

    steps:
      - name: Check out extension source
        uses: actions/checkout@v7

      - name: Use the existing tag for manual runs when available
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must use the form vMAJOR.MINOR.PATCH"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git fetch --depth=1 origin "refs/tags/${RELEASE_TAG}"
            git checkout --detach FETCH_HEAD
            echo "Using the existing tag ${RELEASE_TAG}."
          else
            echo "Tag ${RELEASE_TAG} does not exist yet; checking the selected branch commit."
          fi

      - name: Validate release tag and package versions before building
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
          if match is None:
              raise SystemExit(f"Tag {tag!r} must use the form vMAJOR.MINOR.PATCH")

          version = ".".join(match.groups())
          extension = "backend-extensions/com_calagopus_chat"
          with open(f"{extension}/Cargo.toml", "rb") as manifest_file:
              cargo_version = tomllib.load(manifest_file)["package"]["version"]
          with open(f"{extension}/frontend/package.json", encoding="utf-8") as package_file:
              frontend_version = json.load(package_file)["version"]

          if cargo_version != version or frontend_version != version:
              raise SystemExit(
                  f"Tag {version} must match Cargo.toml ({cargo_version}) and "
                  f"frontend/package.json ({frontend_version})"
              )
          PY

      - name: Check out Calagopus Panel
        uses: actions/checkout@v7
        with:
          repository: calagopus/panel
          ref: ${{ matrix.panel_ref }}
          path: panel

      - name: Add the extension to the Panel workspace
        shell: bash
        run: |
          set -euo pipefail
          cp -R backend-extensions/com_calagopus_chat panel/backend-extensions/com_calagopus_chat
          mkdir -p panel/frontend/extensions
          ln -s ../../backend-extensions/com_calagopus_chat/frontend \
            panel/frontend/extensions/com_calagopus_chat

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
          cache_dependency_path: panel/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: panel/frontend
        run: pnpm install --no-frozen-lockfile

      - name: Type-check and build Panel frontend with the extension
        working-directory: panel/frontend
        run: pnpm build:ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: panel -> target
          shared-key: ${{ matrix.panel_ref }}
          add-rust-environment-hash-key: false
          cache-workspace-crates: true

      - name: Build Rust extension with the Panel profile
        working-directory: panel
        env:
          SQLX_OFFLINE: 'true'
          CARGO_BUILD_JOBS: '2'
        run: cargo build --profile heavy-release --package com_calagopus_chat

  release:
    name: Package and publish extension
    runs-on: ubuntu-24.04
    needs: [prepare, preflight]
    if: needs.prepare.outputs.should_release == 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Use the existing tag for manual runs when available
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must use the form vMAJOR.MINOR.PATCH"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git fetch --depth=1 origin "refs/tags/${RELEASE_TAG}"
            git checkout --detach FETCH_HEAD
            echo "Using the existing tag ${RELEASE_TAG}."
          else
            echo "Tag ${RELEASE_TAG} does not exist yet; packaging the selected branch commit."
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate release tag and package versions
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
          if match is None:
              raise SystemExit(f"Tag {tag!r} must use the form vMAJOR.MINOR.PATCH")

          version = ".".join(match.groups())
          extension = "backend-extensions/com_calagopus_chat"
          with open(f"{extension}/Cargo.toml", "rb") as manifest_file:
              cargo_version = tomllib.load(manifest_file)["package"]["version"]
          with open(f"{extension}/frontend/package.json", encoding="utf-8") as package_file:
              frontend_version = json.load(package_file)["version"]

          if cargo_version != version:
              raise SystemExit(f"Tag version {version} does not match Cargo.toml version {cargo_version}")
          if frontend_version != version:
              raise SystemExit(
                  f"Tag version {version} does not match frontend/package.json version {frontend_version}"
              )

          print(f"Validated release version {version}")
          PY

      - name: Prepare version changelog for the GitHub Release
        id: changelog
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          changelog = Path("backend-extensions/com_calagopus_chat/frontend/src/CHANGELOG.md")
          lines = changelog.read_text(encoding="utf-8").splitlines()
          heading = re.compile(rf"^##\s+{re.escape(version)}(?:\s|$)")

          start = next((index for index, line in enumerate(lines) if heading.match(line)), None)
          if start is None:
              raise SystemExit(f"No changelog section found for release {version}")

          end = next(
              (index for index in range(start + 1, len(lines)) if lines[index].startswith("## ")),
              len(lines),
          )
          section = "\n".join(lines[start:end]).strip()
          if not section:
              raise SystemExit(f"Changelog section for release {version} is empty")

          release_notes = Path(os.environ["RUNNER_TEMP"]) / "calagopus-chat-release-notes.md"
          release_notes.write_text(section + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={release_notes}\n")
          print(f"Prepared changelog section for {version}: {release_notes}")
          PY

      - name: Build .c7s.zip archive
        shell: bash
        run: |
          set -euo pipefail

          source_dir="backend-extensions/com_calagopus_chat"
          stage_dir="$RUNNER_TEMP/com_calagopus_chat"
          archive="$GITHUB_WORKSPACE/All-in-One.c7s.zip"

          mkdir -p "$stage_dir/backend" "$stage_dir/frontend" "$stage_dir/migrations"
          cp "$source_dir/Metadata.toml" "$stage_dir/Metadata.toml"
          cp "$source_dir/Cargo.toml" "$stage_dir/backend/Cargo.toml"
          cp -R "$source_dir/src" "$stage_dir/backend/src"
          cp "$source_dir/frontend/package.json" "$stage_dir/frontend/package.json"
          cp -R "$source_dir/frontend/src" "$stage_dir/frontend/src"
          cp -R "$source_dir/migrations/." "$stage_dir/migrations/"

          rm -f "$archive"
          (
            cd "$stage_dir"
            zip -q -r "$archive" Metadata.toml backend frontend migrations
          )

          unzip -t "$archive"
          python - "$archive" <<'PY'
          import sys
          import zipfile

          archive_path = sys.argv[1]
          with zipfile.ZipFile(archive_path) as archive:
              names = set(archive.namelist())
          required = {
              "Metadata.toml",
              "backend/",
              "backend/Cargo.toml",
              "backend/src/",
              "backend/src/lib.rs",
              "frontend/",
              "frontend/src/",
              "frontend/package.json",
              "frontend/src/index.ts",
              "migrations/",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit("Archive is missing required entries: " + ", ".join(missing))
          up_files = sorted(
              name for name in names
              if name.startswith("migrations/") and name.endswith("/up.sql")
          )
          if not up_files:
              raise SystemExit("Archive does not contain a migration up.sql file")
          for up_file in up_files:
              down_file = up_file.rsplit("/", 1)[0] + "/down.sql"
              if down_file not in names:
                  raise SystemExit(f"Migration {up_file!r} is missing {down_file!r}")
          if "frontend/tsconfig.json" in names:
              raise SystemExit("Do not ship frontend/tsconfig.json; Calagopus generates it on install")
          print(f"Validated {archive_path}")
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: All-in-One ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.changelog.outputs.path }}
          generate_release_notes: true
          files: All-in-One.c7s.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

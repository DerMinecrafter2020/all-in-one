<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1400" viewBox="0 0 1500 1400" role="img" aria-labelledby="title desc">
  <title id="title">Minecraft version changer admin settings mockup</title>
  <desc id="desc">A code-based mockup of the actual stacked Admin settings page: visibility, Egg selection, MCJars credentials, icon settings, type order, and Egg mappings.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182232" />
      <stop offset="1" stop-color="#101720" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".2" />
    </filter>
  </defs>
  <rect width="1500" height="1400" fill="url(#page)" />
  <g transform="translate(0,-100)">
  <rect x="106" y="142" width="1288" height="1240" rx="12" fill="#273242" stroke="#485568" filter="url(#shadow)" />
  <circle cx="134" cy="174" r="13" fill="#344a61" />
  <path d="M128 174h12M134 168v12" stroke="#9ce8d3" stroke-width="1.5" stroke-linecap="round" />
  <text x="160" y="172" fill="#eff4fa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Minecraft version changer</text>
  <text x="160" y="193" fill="#a6b2c1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Configure the MCJars catalog, per-type Egg mappings, and local statistics.</text>
  <text x="132" y="229" fill="#9aa8b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">Catalog and build requests go from the Panel server to MCJars. JAR SHA-256 fingerprints are sent only for build lookup.</text>
  <rect x="132" y="247" width="1236" height="73" rx="8" fill="#45391f" stroke="#88703a" />
  <path d="M153 266l9 17h-18z" fill="#e7bf62" />
  <text x="179" y="274" fill="#f2d99a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="650">Installations run only while the server is stopped.</text>
  <text x="179" y="294" fill="#dacb9f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">Worlds, mods, plugins, and configuration are preserved; reviewed software paths only. Egg and Java image changes need Panel admin permissions.</text>

  <text x="132" y="354" fill="#edf2f8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="600">Show the version changer in Minecraft server sidebars</text>
  <text x="132" y="372" fill="#8997a8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">Control whether this All-in-One function appears in server sidebars.</text>
  <rect x="1312" y="343" width="56" height="28" rx="14" fill="#347d69" />
  <circle cx="1350" cy="357" r="10" fill="#e1fff4" />

  <text x="132" y="414" fill="#edf2f8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="600">Show on all Eggs</text>
  <text x="132" y="432" fill="#8997a8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">Built-in compatibility checks still block unsupported controls.</text>
  <rect x="1312" y="403" width="56" height="28" rx="14" fill="#263242" stroke="#647287" />
  <circle cx="1326" cy="417" r="10" fill="#c0cad7" />

  <text x="132" y="469" fill="#a7b4c4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">Eggs enabled for this function</text>
  <rect x="132" y="479" width="1236" height="49" rx="8" fill="#1e2938" stroke="#586579" />
  <rect x="146" y="490" width="92" height="27" rx="6" fill="#38485d" />
  <text x="192" y="508" fill="#e1e8f0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">Paper ×</text>
  <rect x="245" y="490" width="92" height="27" rx="6" fill="#38485d" />
  <text x="291" y="508" fill="#e1e8f0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">Fabric ×</text>
  <text x="358" y="507" fill="#7e8d9e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">Search Eggs…</text>

  <text x="132" y="566" fill="#a7b4c4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">MCJars API URL</text>
  <rect x="132" y="576" width="1236" height="43" rx="8" fill="#1e2938" stroke="#586579" />
  <text x="149" y="603" fill="#e1e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">https://mcjars.app</text>
  <text x="132" y="637" fill="#8492a3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">Use the trusted HTTPS mcjars.app service endpoint.</text>

  <text x="132" y="678" fill="#a7b4c4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">MCJars organization API key</text>
  <rect x="132" y="688" width="1236" height="43" rx="8" fill="#1e2938" stroke="#586579" />
  <text x="149" y="715" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">••••••••••••••••</text>
  <text x="132" y="749" fill="#8492a3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">A key is stored encrypted in Panel settings. Leave blank to keep it.</text>
  <rect x="132" y="768" width="14" height="14" rx="3" fill="#263242" stroke="#77869a" />
  <text x="155" y="780" fill="#c1ccd9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">Remove the stored MCJars API key</text>

  <text x="132" y="821" fill="#a7b4c4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">MCJars icon base URL</text>
  <rect x="132" y="831" width="826" height="43" rx="8" fill="#1e2938" stroke="#586579" />
  <text x="149" y="858" fill="#e1e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">https://s3.mcjars.app/icons/</text>
  <text x="986" y="821" fill="#a7b4c4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">Icon format</text>
  <rect x="986" y="831" width="382" height="43" rx="8" fill="#1e2938" stroke="#586579" />
  <text x="1003" y="858" fill="#e1e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">PNG</text>
  <path d="m1340 848 6 6 6-6" fill="none" stroke="#a5b1bf" stroke-width="1.4" />

  <text x="132" y="916" fill="#a7b4c4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">MCJars type order (JSON)</text>
  <rect x="132" y="926" width="1236" height="192" rx="8" fill="#171f2b" stroke="#586579" />
  <text x="150" y="949" fill="#d2dbe6" font-family="Consolas,Menlo,monospace" font-size="10">[</text>
  <text x="170" y="970" fill="#d2dbe6" font-family="Consolas,Menlo,monospace" font-size="10">  { "category": "recommended", "types": ["PAPER", "PURPUR"] },</text>
  <text x="170" y="991" fill="#d2dbe6" font-family="Consolas,Menlo,monospace" font-size="10">  { "category": "established", "types": ["FABRIC", "FORGE"] },</text>
  <text x="170" y="1012" fill="#d2dbe6" font-family="Consolas,Menlo,monospace" font-size="10">  { "category": "experimental", "types": ["NEOFORGE"] },</text>
  <text x="170" y="1033" fill="#d2dbe6" font-family="Consolas,Menlo,monospace" font-size="10">  { "category": "miscellaneous", "types": [] }</text>
  <text x="170" y="1054" fill="#d2dbe6" font-family="Consolas,Menlo,monospace" font-size="10">  { "category": "limbos", "types": [] }</text>
  <text x="150" y="1096" fill="#d2dbe6" font-family="Consolas,Menlo,monospace" font-size="10">]</text>

  <g transform="translate(0,96)">
  <text x="132" y="1049" fill="#edf2f8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="600">Collect local install statistics</text>
  <text x="132" y="1068" fill="#8997a8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">Only aggregate type and version counts are stored; no server or user IDs.</text>
  <rect x="1312" y="1034" width="56" height="28" rx="14" fill="#347d69" />
  <circle cx="1350" cy="1048" r="10" fill="#e1fff4" />

  <text x="132" y="1095" fill="#edf2f8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">Provider type to Panel Egg mappings</text>
  <text x="132" y="1125" fill="#dce4ed" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">Paper (recommended · PAPER)</text>
  <rect x="656" y="1107" width="712" height="36" rx="8" fill="#1e2938" stroke="#586579" />
  <text x="674" y="1130" fill="#e1e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">Paper Java Egg</text>
  <path d="m1340 1121 6 6 6-6" fill="none" stroke="#a5b1bf" stroke-width="1.4" />
  <text x="132" y="1176" fill="#dce4ed" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">Fabric Loader (established · FABRIC)</text>
  <rect x="656" y="1158" width="712" height="36" rx="8" fill="#1e2938" stroke="#586579" />
  <text x="674" y="1181" fill="#e1e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9">Fabric Java Egg</text>
  <path d="m1340 1172 6 6 6-6" fill="none" stroke="#a5b1bf" stroke-width="1.4" />
  <rect x="1238" y="1221" width="130" height="42" rx="8" fill="#3f81b4" />
  <text x="1303" y="1247" fill="#f4f8fc" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650">Save settings</text>
  </g>
  </g>
  <text x="1390" y="1380" fill="#aab4c1" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" letter-spacing=".7">CODE-BASED MOCKUP · NOT A LIVE SCREENSHOT</text>
</svg>

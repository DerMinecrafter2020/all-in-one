  <text x="86" y="145" fill="#b1bdcb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Review online and offline players, player lists, banned IPs, server capacity, inventory, and selected player stats.</text>
  <text x="86" y="164" fill="#8794a4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Sensitive actions require confirmation and the appropriate Panel permissions.</text>


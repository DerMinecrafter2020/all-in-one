<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc">
  <title id="title">Player manager page mockup</title>
  <desc id="desc">A code-based mockup of the actual PlayerManagerPage layout: notices, non-whitelisted attempts, online players, list tabs, and manage-by-name controls.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182232" />
      <stop offset="1" stop-color="#101720" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".18" />
    </filter>
  </defs>

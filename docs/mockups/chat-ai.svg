<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">All-in-One Chat page mockup</title>
  <desc id="desc">A code-based mockup of the actual single-column chat conversation, AI power-action confirmation, and message composer.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182232" />
      <stop offset="1" stop-color="#101720" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".25" />
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#page)" />
  <rect x="70" y="42" width="1300" height="812" rx="12" fill="#202a38" stroke="#445064" filter="url(#shadow)" />

  <rect x="71" y="43" width="1298" height="70" rx="11" fill="#242f3f" />
  <rect x="71" y="101" width="1298" height="12" fill="#242f3f" />
  <rect x="86" y="59" width="36" height="36" rx="8" fill="#303c4e" />
  <path d="m108 70-8 7 8 7" fill="none" stroke="#d5deea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="145" cy="77" r="18" fill="#506788" />
  <path d="M137 76h16M137 81h11" stroke="#e6edf5" stroke-width="1.6" stroke-linecap="round" />
  <text x="174" y="74" fill="#f3f6fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Minecraft Community</text>
  <text x="174" y="94" fill="#aeb8c6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Group conversation · mention @AI for a reply</text>

  <rect x="87" y="131" width="1266" height="572" rx="8" fill="#1d2735" />
  <text x="111" y="160" fill="#9ba8b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="1.2">TODAY · 10:42 AM</text>

  <text x="111" y="195" fill="#aeb8c6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Sam K.</text>
  <rect x="111" y="205" width="530" height="54" rx="12" fill="#2c3747" stroke="#414d60" />
  <text x="130" y="238" fill="#e7edf5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Our Survival Server seems stuck. Could someone check it?</text>
  <text x="111" y="277" fill="#7e8b9b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">10:42 AM</text>

  <rect x="788" y="294" width="535" height="54" rx="12" fill="#344c72" stroke="#49648f" />
  <text x="809" y="327" fill="#f1f5fb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">@AI can you restart Survival Server?</text>
  <text x="1322" y="366" fill="#8290a1" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">10:43 AM</text>

  <text x="111" y="402" fill="#aeb8c6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Calagopus AI</text>
  <rect x="111" y="412" width="545" height="55" rx="12" fill="#2c3747" stroke="#414d60" />
  <text x="130" y="445" fill="#e7edf5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">I can request a restart. Confirm below to send it to the Panel.</text>
  <text x="111" y="485" fill="#7e8b9b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">10:43 AM</text>

  <rect x="111" y="502" width="545" height="142" rx="10" fill="#202c3b" stroke="#536278" />
  <text x="132" y="533" fill="#edf2f8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650">Requested action: restart Survival Server.</text>
  <text x="132" y="558" fill="#adb8c7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Nothing happens until you confirm. This request expires at 10:48 AM.</text>
  <rect x="132" y="579" width="165" height="42" rx="8" fill="#41b883" />
  <text x="214" y="605" fill="#10221d" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Confirm restart</text>
  <rect x="307" y="579" width="132" height="42" rx="8" fill="#303b4b" stroke="#536278" />
  <text x="373" y="605" fill="#e1e7ee" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Cancel request</text>

  <rect x="88" y="716" width="1264" height="121" rx="8" fill="#242f3f" />
  <path d="M88 716h1264" stroke="#465266" />
  <rect x="111" y="733" width="15" height="15" rx="3" fill="#55c79e" />
  <path d="m114 740 3 3 6-7" fill="none" stroke="#10221d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text x="134" y="745" fill="#d5dde7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Enter sends</text>
  <text x="1328" y="745" fill="#9aa7b7" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">Shift+Enter for a new line</text>
  <rect x="111" y="760" width="1181" height="54" rx="8" fill="#1b2532" stroke="#4a5667" />
  <text x="130" y="793" fill="#8f9cac" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Write a message…</text>
  <rect x="1307" y="760" width="45" height="54" rx="8" fill="#4ca8e8" />
  <path d="m1320 786 19-10-6 19-4-7z" fill="#102033" />

  <text x="1360" y="878" fill="#93a0af" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" letter-spacing=".7">CODE-BASED MOCKUP · NOT A LIVE SCREENSHOT</text>
</svg>

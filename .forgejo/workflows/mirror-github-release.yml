name: Mirror GitHub release to Forgejo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing mirrored GitHub release tag to sync (for example v0.3.4)
        required: true
        type: string

concurrency:
  group: mirror-github-release
  cancel-in-progress: false

jobs:
  mirror-release:
    name: Create matching Forgejo release
    runs-on: docker
    timeout-minutes: 20

    steps:
      - name: Check out the workflow version
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mirror the published GitHub release and archive
        env:
          EVENT_NAME: ${{ forgejo.event_name }}
          REF_NAME: ${{ forgejo.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: python3 .forgejo/scripts/mirror_github_release.py
